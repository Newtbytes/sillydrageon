name: Pull Request Review Process

on:
  pull_request:
    types: [synchronize, opened, reopened, labeled, unlabeled]

jobs:
  self-approve:
    if: ${{ !contains(github.event.*.labels.*.name, 'self-approved') && github.event.pull_request.user.login == github.repository_owner && github.event.pull_request.requested_reviewers[0] == null}}
    name: Check Self Approved
    runs-on: ubuntu-latest
    steps:
      - name: Check for pull approval
        run: |
          exit 1
