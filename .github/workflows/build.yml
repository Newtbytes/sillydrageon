name: Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - "Cargo.*"
      - "src/**"
      - "lorax/**"
      - "dialect/**"
      - "tests/**"
      - "**.rs"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --workspace --verbose
